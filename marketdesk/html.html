<script>

const show = t => $('#msg').textContent = t;
if (!window.LightweightCharts) { show('The chart library failed to initialise.'); throw new Error('no lib'); }

const SYMS = {
  R_10:'Volatility 10 Index', R_25:'Volatility 25 Index', R_50:'Volatility 50 Index', R_75:'Volatility 75 Index', R_100:'Volatility 100 Index',
  '1HZ10V':'Volatility 10 (1s) Index', '1HZ25V':'Volatility 25 (1s) Index', '1HZ50V':'Volatility 50 (1s) Index',
  '1HZ75V':'Volatility 75 (1s) Index', '1HZ100V':'Volatility 100 (1s) Index',
  BOOM500:'Boom 500 Index', BOOM1000:'Boom 1000 Index', CRASH500:'Crash 500 Index', CRASH1000:'Crash 1000 Index', frxXAUUSD:'Gold/USD'
};
const LABEL = { frxXAUUSD: 'XAUUSD' };
const TFS = {M1:60,M2:120,M3:180,M5:300,M10:600,M15:900,M20:1200,M30:1800,H1:3600,H2:7200,H4:14400,H6:21600,H8:28800,D:86400,W:604800,MN:2592000};
const LONG = {60:'1 minute',120:'2 minutes',180:'3 minutes',300:'5 minutes',600:'10 minutes',900:'15 minutes',1200:'20 minutes',1800:'30 minutes',3600:'1 hour',7200:'2 hours',14400:'4 hours',21600:'6 hours',28800:'8 hours',86400:'24 hours',604800:'1 week',2592000:'1 month'};
const MINS = [60,120,180,300,600,900,1200,1800], HRS = [3600,7200,14400,21600,28800,86400], DAYS = [604800,2592000];
const RANGES = {'6m':182*86400,'3m':91*86400,'1m':30*86400,'5d':5*86400,'1d':86400};
const OV = new URLSearchParams(location.search).get('ws');
const URLS = OV ? [OV] : ['wss://api.derivws.com/trading/v1/options/ws/public','wss://ws.derivws.com/websockets/v3?app_id=1089','wss://ws.binaryws.com/websockets/v3?app_id=1089'];
let UP = '#089981', DOWN = '#f23645';

let S = {}; try { S = JSON.parse(localStorage.dc || '{}'); } catch (e) {}
let sym = SYMS[S.sym] ? S.sym : 'R_25', gran = Object.values(TFS).includes(S.gran) ? S.gran : 86400, type = S.type || 'candles', dark = !!S.dark;
let favs = Array.isArray(S.favs) ? S.favs.filter(v => LONG[v]) : [60, 300, 900, 3600, 14400, 86400];
let favT = Array.isArray(S.favT) ? S.favT : [], ftbPos = S.ftb || null, tz = S.tz || 'UTC';
let wlW = +S.wlW || 0, wlWm = +S.wlWm || 0, alerts = Array.isArray(S.alerts) ? S.alerts : [];   // watchlist widths (desktop / mobile) the user dragged to
let wl = Array.isArray(S.wl) ? S.wl.filter(s => SYMS[s]) : [], wlOpen = S.wlOpen !== undefined ? S.wlOpen !== false : !matchMedia('(max-width:760px)').matches, cursorMode = ['cross', 'dot', 'arrow', 'demo'].includes(S.cursor) ? S.cursor : 'cross';
const DEF = { prevClose: false, body: true, bodyUp: '#089981', bodyDn: '#f23645', border: true, borderUp: '#089981', borderDn: '#f23645', wick: true, wickUp: '#089981', wickDn: '#f23645', prec: 'auto',
  title: true, titleMode: 'desc', mkt: true, ohlc: true, chg: true, lgBg: true, lgAlpha: 0.5,
  scaleBtns: 'hover', lockOn: false, ratio: 1, countdown: false, lastMode: 'both', hl: 'hidden', weekday: true, dfmt: 'dmy', h12: false, keepLeft: false,
  bgType: 'solid', bg: '', grid: 'both', gridV: '', gridH: '', cross: '', wm: 'none', wmColor: '', txt: '', fs: 12, lines: '', nav: 'hover', mt: 10, mb: 8, mr: 10,
  wbSide: 'left', sepDHour: 1, sepDHide: '', sepWHide: '', sepD: true, sepDCol: '#787b86', sepDW: 1, sepDSt: 'dashed', sepW: true, sepWCol: '#2962ff', sepWW: 1, sepWSt: 'solid' };
let cs = Object.assign({}, DEF, S.cs || {}), keepLeft = null;
UP = cs.bodyUp; DOWN = cs.bodyDn;
const save = () => { try { localStorage.dc = JSON.stringify({ sym, gran, type, dark, favs, favT, ftb: ftbPos, tz, wl, wlOpen, wlW, wlWm, alerts, cursor: cursorMode, cs, rp: { speed: replay.speed, tr: replay.tr } }); } catch (e) {} };

const chart = LightweightCharts.createChart($('#c'), {
  autoSize: true, crosshair: { mode: 0 },
  timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6 },
  rightPriceScale: { scaleMargins: { top: .1, bottom: .1 } }
});

function applyTheme() {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const line = dark ? '#2a2e39' : '#e0e3eb', grid = dark ? '#1e222d' : '#f0f3fa';
  chart.applyOptions({
    layout: { background: { color: dark ? '#131722' : '#ffffff' }, textColor: dark ? '#d1d4dc' : '#131722' },
    grid: { vertLines: { color: grid }, horzLines: { color: grid } },
    rightPriceScale: { borderColor: line }, timeScale: { borderColor: line }
  });
  $('#ic').setAttribute('d', dark
    ? 'M12 4V2m0 20v-2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'
    : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z');
}
applyTheme();

const f = n => n.toLocaleString('en', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const pt = (c, prev) => type !== 'candles' ? { time: c.time, value: c.close }
  : cs.prevClose && prev ? { ...c, ...(c.close >= prev.close ? { color: cs.bodyUp, borderColor: cs.borderUp, wickColor: cs.wickUp } : { color: cs.bodyDn, borderColor: cs.borderDn, wickColor: cs.wickDn }) } : c;
const ptAll = () => candles.map((c, i) => pt(c, candles[i - 1]));
const ais = base => {
  const b = base(); if (!cs.lockOn || !b) return b;
  const rg = chart.timeScale().getVisibleLogicalRange(); if (!rg) return b;
  const mid = (b.priceRange.minValue + b.priceRange.maxValue) / 2, hh = cs.ratio * (rg.to - rg.from) / 2;
  return { ...b, priceRange: { minValue: mid - hh, maxValue: mid + hh } };

const tfName = () => Object.keys(TFS).find(k => TFS[k] === gran);

function legend(t) {
  const i = idx.has(t) ? idx.get(t) : lastIdx(), b = candles[i];
  const name = cs.titleMode === 'tick' ? lab(sym) : cs.titleMode === 'both' ? `${lab(sym)} · ${SYMS[sym]}` : SYMS[sym];
  const head = (cs.title ? `<b>${name} · ${tfName()}</b>` : '') + (cs.mkt ? `<span class="mk${$('#st').classList.contains('ok') ? ' ok' : ''}"></span>` : '');
  if (!b) { $('#lg').innerHTML = head; return; }
  const prev = candles[i - 1] ? candles[i - 1].close : b.open, ch = b.close - prev, cls = ch >= 0 ? 'u' : 'd';
  const vals = (cs.ohlc ? `O${f(b.open)} H${f(b.high)} L${f(b.low)} C${f(b.close)} ` : '') + (cs.chg ? `${ch >= 0 ? '+' : ''}${f(ch)} (${ch >= 0 ? '+' : ''}${(ch / prev * 100).toFixed(2)}%)` : '');
  $('#lg').innerHTML = head + (vals ? `<span class="${cls}">${vals}</span>` : '');
}

chart.subscribeCrosshairMove(p => legend(p.time));

function buildSeries() {
  if (series) chart.removeSeries(series);
  const pf = common();
  series = type === 'candles'
    ? chart.addCandlestickSeries({ ...pf, ...candleOpts() })
    : type === 'line' ? chart.addLineSeries({ ...pf, color: '#2962ff', lineWidth: 2 })
    : chart.addAreaSeries({ ...pf, lineColor: '#2962ff', topColor: 'rgba(41,98,255,.3)', bottomColor: 'rgba(41,98,255,0)' });
  series.setData(shown());
  hlines = []; syncDraw();
}

// Indicators
const sma = n => { const a = vis(), o = []; let s = 0; a.forEach((c, i) => { s += c.close; if (i >= n) s -= a[i - n].close; if (i >= n - 1) o.push({ time: c.time, value: s / n }); }); return o; };
const ema = n => { const k = 2 / (n + 1); let e; return vis().map(c => ({ time: c.time, value: e = e === undefined ? c.close : c.close * k + e * (1 - k) })); };
const refreshInds = () => inds.forEach(i => i.s.setData(i.fn()));
$('#ind').onchange = e => {
  const v = e.target.value; e.target.value = '';
  if (v === 'clear') { inds.forEach(i => chart.removeSeries(i.s)); inds = []; return; }
  if (!v || inds.some(i => i.id === v)) return;
  const s = chart.addLineSeries({ color: v === 'sma' ? '#ff9800' : '#9c27b0', lineWidth: 1, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
  inds.push({ id: v, s, fn: () => v === 'sma' ? sma(20) : ema(50) }); refreshInds();

const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
function wbMark() { $('#wb-wl').classList.toggle('on', wlOpen); $('#wb-al').classList.toggle('on', wpOpen === 'alerts'); $('#wb-tr').classList.toggle('on', wpOpen === 'tree'); }
function alBadge() { const n = alerts.filter(a => a.hit && !a.seen).length, b = document.querySelector('#wb-al .wbadge'); b.hidden = !n; b.textContent = n; }
function wpApplyW() { const m = matchMedia('(max-width:760px)').matches; $('#wp').style.width = Math.min(m ? Math.round(innerWidth * 0.72) : 320, innerWidth - 60) + 'px'; }
function showWp(first) {
  const el = $('#wp'), open = !!wpOpen; wpApplyW();
  if (first) { el.classList.add('collapsed'); el.dataset.sm = 'closed'; return; }
  if ((el.dataset.sm === 'open') === open) return;
  if (open) smOpen(el, [el.querySelector('.wh'), ...$('#wpb').children]); else smClose(el);
}
function setPanel(name) {   // 'wl' | 'alerts' | 'tree' | '' (closed)
  const wantWl = name === 'wl'; if (wlOpen !== wantWl) { wlOpen = wantWl; save(); showWl(); }
  wpOpen = name === 'alerts' || name === 'tree' ? name : '';
  if (wpOpen === 'alerts') alerts.forEach(a => { a.seen = true; });
  if (wpOpen) renderWp(); showWp(); wbMark(); alBadge(); save();
}
function renderWp() {
  const body = $('#wpb');
  if (wpOpen === 'alerts') {
    $('#wpt').textContent = 'Alerts';
    const last = candles.length ? candles[candles.length - 1].close : null;
    const list = alerts.slice().reverse().map(a => `<div class="alr${a.hit ? ' hit' : ''}"><div><b>${lab(a.sym)}</b><small>${a.dir === 'up' ? '▲ crosses above ' : '▼ crosses below '}${a.price}${a.hit ? ' · triggered ' + new Date(a.t).toLocaleTimeString() : ''}</small></div><button data-al="${a.id}" title="Delete alert" aria-label="Delete alert">${TRASH}</button></div>`).join('');
    body.innerHTML = `<div class="alf"><div class="alh">New alert on ${lab(sym)}</div><div class="alin"><input id="alp" type="number" step="any" placeholder="Price" value="${last == null ? '' : +last.toFixed(dec)}"><button id="alb">Add</button></div></div>` + (list || '<p class="wempty">No alerts yet. Enter a price above and you will be told when the market crosses it.</p>');
  } else if (wpOpen === 'tree') {
    $('#wpt').textContent = 'Object tree';
    body.innerHTML = D.length ? D.map((d, i) => [d, i]).reverse().map(([d, i]) => `<div class="otr${i === sel ? ' sel' : ''}${d.hidden ? ' off' : ''}" data-i="${i}"><span class="otc" style="background:${d.color || '#787b86'}"></span><span class="otn">${TNAME[d.type] || d.type}${d.text ? ' · ' + esc(d.text) : ''}</span><button data-ot="eye" title="Show / hide" aria-label="Show or hide">${d.hidden ? EYE_OFF : EYE}</button><button data-ot="lock" title="Lock / unlock" aria-label="Lock or unlock">${d.locked ? SBI.lock : SBI.open}</button><button data-ot="del" title="Delete" aria-label="Delete">${TRASH}</button></div>`).join('') + '<div class="otf"><button data-ot="clear">Remove all drawings</button></div>' : '<p class="wempty">No drawings yet. Pick a tool on the left and draw on the chart.</p>';
  }
}
function setDrawProp(i, p) { undoS.push(snap()); redoS = []; Object.assign(D[i], p); syncDraw(); updUR(); }
function addAlert(price) {
  if (!isFinite(price)) return; const last = candles.length ? candles[candles.length - 1].close : price;
  alerts.push({ id: Date.now() + Math.random(), sym, price, dir: price >= last ? 'up' : 'down', hit: false, seen: true });
  save(); renderWp(); try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.classList.add('off'), 3600); setTimeout(() => t.remove(), 4000); }
function checkAlerts(s, p) {
  if (!alerts.length || !isFinite(p)) return; let fired = false;
  alerts.forEach(a => {
    if (a.sym !== s || a.hit || !((a.dir === 'up' && p >= a.price) || (a.dir === 'down' && p <= a.price))) return;
    a.hit = true; a.seen = wpOpen === 'alerts'; a.t = Date.now(); fired = true;
    const msg = `${lab(a.sym)} ${a.dir === 'up' ? 'crossed above' : 'crossed below'} ${a.price}`; toast(msg);
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.setValueAtTime(0.15, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5); o.start(); o.stop(ac.currentTime + 0.5); } catch (e) {}
    try { if (window.Notification && Notification.permission === 'granted') new Notification('Alert', { body: msg }); } catch (e) {}
  });
  if (fired) { save(); alBadge(); if (wpOpen === 'alerts') renderWp(); }
}
$('#wb-wl').onclick = () => setPanel(wlOpen ? '' : 'wl');
$('#wb-al').onclick = () => setPanel(wpOpen === 'alerts' ? '' : 'alerts');
$('#wb-tr').onclick = () => setPanel(wpOpen === 'tree' ? '' : 'tree');
$('#wpx').onclick = () => setPanel('');
$('#wpb').addEventListener('click', e => {
  const t = e.target.closest('button, .otr'); if (!t) return;
  if (t.id === 'alb') { addAlert(+$('#alp').value); return; }
  if (t.dataset.al) { alerts = alerts.filter(a => String(a.id) !== t.dataset.al); save(); alBadge(); renderWp(); return; }
  const row = e.target.closest('.otr'), i = row ? +row.dataset.i : -1, a = t.dataset.ot;
  if (a === 'clear') { clearAll(); idle(); renderWp(); return; }
  if (i < 0 || !D[i]) return;
  if (a === 'eye') { setDrawProp(i, { hidden: !D[i].hidden }); if (D[i].hidden && sel === i) sel = -1; }
  else if (a === 'lock') setDrawProp(i, { locked: !D[i].locked });
  else if (a === 'del') removeDrawing(i);
  else sel = i;
  renderWp();
});
$('#wpb').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'alp') addAlert(+e.target.value); });
setInterval(() => { if (wpOpen !== 'tree') return; const k = D.map(d => d.type + (d.hidden ? 'h' : '') + (d.locked ? 'l' : '') + (d.text || '')).join('|') + '#' + sel; if (k !== treeKey) { treeKey = k; renderWp(); } }, 250);
document.addEventListener('click', e => { if (!e.composedPath().some(n => n.id === 'symm' || n.id === 'symb')) $('#symm').hidden = true; });
renderSym(); renderWl(); showWl(true); showWp(true); alBadge(); applyCS();
// Space = next symbol in the watchlist (Shift+Space = previous). During a replay, Space still plays/pauses.
addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.ctrlKey || e.metaKey || e.altKey || replay.on || !wl.length) return;
  const t = e.target; if (t && (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable)) return;
  if (!$('#dlg').hidden) return;
  e.preventDefault(); if (t && t.tagName === 'BUTTON') t.blur();
  const i = wl.indexOf(sym), n = wl.length, next = wl[i < 0 ? (e.shiftKey ? n - 1 : 0) : (i + (e.shiftKey ? n - 1 : 1)) % n];
  if (next && next !== sym) setSym(next);
});

connect();
</script>
