<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Pills Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0c0c0c;color:#fff;}
.mock-hero{max-width:900px;margin:0 auto;padding:4rem 1.6rem 0;text-align:center;}
.mock-hero h1{font-size:2.4rem;font-weight:900;margin-bottom:1.2rem;}
.mock-btn{display:inline-block;background:#fff;color:#0c0c0c;font-weight:700;padding:0.9rem 1.8rem;border-radius:999px;font-size:0.95rem;margin-bottom:0.5rem;}
.pit-container{position:relative;width:100%;max-width:1100px;margin:2rem auto 0;height:420px;overflow:hidden;}
.pill{
  position:absolute;
  top:0;left:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 20px;
  border-radius:999px;
  font-weight:800;
  font-size:14px;
  letter-spacing:0.02em;
  text-transform:uppercase;
  white-space:nowrap;
  will-change:transform;
  box-shadow:0 6px 18px rgba(0,0,0,0.35);
  pointer-events:none;
}
.pill svg{width:16px;height:16px;flex-shrink:0;}
.replay-btn{display:block;margin:1.5rem auto 3rem;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#fff;padding:0.6rem 1.4rem;border-radius:999px;font-size:0.85rem;cursor:pointer;}
.replay-btn:hover{background:rgba(255,255,255,0.08);}
</style>
</head>
<body>

<div class="mock-hero">
  <h1>Focus on what matters most</h1>
  <a class="mock-btn">Check Overdesk for Everyone</a>
</div>

<div class="pit-container" id="pitContainer"></div>
<button class="replay-btn" id="replayBtn">Replay animation</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
  var LABELS = [
    { text: 'Focus mode', color: '#5DCAA5', dark: '#04342C', icon: 'target' },
    { text: 'Deep work', color: '#7F77DD', dark: '#26215C', icon: 'bolt' },
    { text: 'FX calendar', color: '#F0997B', dark: '#4A1B0C', icon: 'calendar' },
    { text: 'Checklist', color: '#EF9F27', dark: '#412402', icon: 'check' },
    { text: 'No distractions', color: '#ED93B1', dark: '#4B1528', icon: 'eye-off' },
    { text: 'Risk control', color: '#85B7EB', dark: '#042C53', icon: 'shield' },
    { text: 'Daily routine', color: '#97C459', dark: '#173404', icon: 'refresh' },
    { text: 'Trading discipline', color: '#F09595', dark: '#501313', icon: 'chart' },
    { text: 'Time blocking', color: '#AFA9EC', dark: '#26215C', icon: 'clock' },
    { text: 'Stay on task', color: '#9FE1CB', dark: '#04342C', icon: 'flag' },
    { text: 'Market alerts', color: '#FAC775', dark: '#412402', icon: 'bell' },
    { text: 'Pre-market prep', color: '#F4C0D1', dark: '#4B1528', icon: 'sunrise' },
    { text: 'Task tracking', color: '#B5D4F4', dark: '#042C53', icon: 'list' },
    { text: 'Build momentum', color: '#C0DD97', dark: '#173404', icon: 'arrow-up' }
  ];

  var ICONS = {
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    bolt: '<path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10 h18 M8 3 v4 M16 3 v4"/>',
    check: '<path d="M20 6 L9 17 l-5-5"/>',
    'eye-off': '<path d="M3 3 l18 18 M10.6 10.6 a3 3 0 0 0 4.2 4.2 M6.5 6.7 C4 8.3 2.5 10.5 2 12 c1.5 4 5.5 7 10 7 1.6 0 3.1-.4 4.4-1.1 M9.9 4.2 C10.6 4.1 11.3 4 12 4 c4.5 0 8.5 3 10 7 -.4 1.1-1 2.2-1.8 3.1"/>',
    shield: '<path d="M12 3 l7 3 v6 c0 4.5-3 7.5-7 9 -4-1.5-7-4.5-7-9 v-6 z"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-3-6.7 M21 3 v6 h-6"/>',
    chart: '<path d="M3 21 h18 M6 17 v-6 M12 17 V7 M18 17 v-10"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7 v5 l3 3"/>',
    flag: '<path d="M5 21 V4 M5 4 h13 l-3 4 3 4 H5"/>',
    bell: '<path d="M6 8 a6 6 0 0 1 12 0 c0 5 2 6 2 6 H4 s2-1 2-6 M10 20 a2 2 0 0 0 4 0"/>',
    sunrise: '<path d="M12 3 v4 M4.2 10.2 l1.4 1.4 M19.8 10.2 l-1.4 1.4 M2 18 h20 M6 18 a6 6 0 0 1 12 0"/>',
    list: '<path d="M8 6 h13 M8 12 h13 M8 18 h13 M3 6 h.01 M3 12 h.01 M3 18 h.01"/>',
    'arrow-up': '<path d="M12 19 V5 M5 12 l7-7 7 7"/>'
  };

  var container = document.getElementById('pitContainer');
  var W = Matter;
  var engine, world, runner, pillEls = [], pillBodies = [];

  function iconSvg(name, color){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
  }

  function buildPills(){
    container.innerHTML = '';
    pillEls = [];
    var w = container.clientWidth;
    LABELS.forEach(function(item){
      var el = document.createElement('div');
      el.className = 'pill';
      el.style.background = item.color;
      el.style.color = item.dark;
      el.innerHTML = iconSvg(item.icon, item.dark) + '<span>' + item.text + '</span>';
      container.appendChild(el);
      pillEls.push(el);
    });
  }

  function startSim(){
    if(engine){ W.Runner.stop(runner); W.World.clear(world); W.Engine.clear(engine); }
    pillBodies = [];
    var w = container.clientWidth;
    var h = container.clientHeight;

    engine = W.Engine.create();
    world = engine.world;
    world.gravity.y = 1;

    var ground = W.Bodies.rectangle(w/2, h+20, w*2, 40, { isStatic: true });
    var leftWall = W.Bodies.rectangle(-20, h/2, 40, h*2, { isStatic: true });
    var rightWall = W.Bodies.rectangle(w+20, h/2, 40, h*2, { isStatic: true });
    W.World.add(world, [ground, leftWall, rightWall]);

    pillEls.forEach(function(el, i){
      var pw = el.offsetWidth;
      var ph = el.offsetHeight;
      el.style.width = pw + 'px';
      el.style.height = ph + 'px';
      el.style.pointerEvents = 'auto';
      el.style.cursor = 'pointer';
      var startX = 60 + Math.random() * (w - 120);
      var body = W.Bodies.rectangle(startX, -100 - i*70, pw, ph, {
        chamfer: { radius: ph/2 },
        restitution: 0.35,
        friction: 0.4,
        frictionAir: 0.005,
        angle: (Math.random()-0.5) * 0.6
      });
      W.Body.setVelocity(body, { x: (Math.random()-0.5)*2, y: 0 });
      pillBodies.push({ el: el, body: body, w: pw, h: ph });

      el.addEventListener('mouseenter', function(){
        W.Body.setVelocity(body, { x: body.velocity.x * 0.3, y: -6 - Math.random()*2 });
        W.Body.setAngularVelocity(body, (Math.random()-0.5) * 0.15);
      });
    });

    W.World.add(world, pillBodies.map(function(p){ return p.body; }));

    runner = W.Runner.create();
    W.Runner.run(runner, engine);

    (function loop(){
      pillBodies.forEach(function(p){
        var x = p.body.position.x - p.w/2;
        var y = p.body.position.y - p.h/2;
        var angle = p.body.angle;
        p.el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + angle + 'rad)';
      });
      requestAnimationFrame(loop);
    })();
  }

  function run(){
    buildPills();
    requestAnimationFrame(function(){ startSim(); });
  }

  document.getElementById('replayBtn').addEventListener('click', run);

  var started = false;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && !started){
        started = true;
        run();
      }
    });
  }, { threshold: 0.3 });
  io.observe(container);
})();
</script>
</body>
</html>
